name: Hybrid C-Rust Automotive ECU CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-safety-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bare-Metal ARM Toolchain & NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi python3-numpy

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Execute Codegen, #![forbid(unsafe_code)] Build, Cortex-M33 Check & 11,500-Cycle Fault-Injection Suite
        run: make all

      - name: Independent metric verification
        run: python3 tests/verify_metrics.py
